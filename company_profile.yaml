# ─────────────────────────────────────────────────────────────────────────────
#  COMPANY PROFILE — Supply Chain Risk Analysis System
#
#  This is the ONLY file you edit to switch companies.
#  Run: python -m module1.main --init-db   after changing this file.
#
#  Current Company: CIPLA LIMITED
# ─────────────────────────────────────────────────────────────────────────────

company:
  name: "Cipla Limited"
  short_name: "Cipla"
  industry: "Pharmaceutical Manufacturing"
  sector: "Healthcare"
  headquarters_country: "India"
  headquarters_city: "Mumbai"
  headquarters_country_code: "IN"
  description: >
    Cipla Limited is a global pharmaceutical company headquartered in Mumbai, India.
    It manufactures generic medicines, active pharmaceutical ingredients (APIs),
    and respiratory, oncology, anti-infective, cardiovascular, and CNS drugs.
    Cipla exports to 80+ countries and operates manufacturing facilities across India,
    South Africa, Uganda, the UK, and the USA.

# ─────────────────────────────────────────────────────────────────────────────
#  SUPPLIERS
#  tier: 1 = direct supplier, 2 = supplier's supplier, 3 = raw material source
#  criticality: critical | high | medium | low
#  dependency_weight: 0.0–1.0 (fraction of this commodity sourced from this supplier)
# ─────────────────────────────────────────────────────────────────────────────
suppliers:
  # ── TIER 1: Direct API Suppliers ──────────────────────────────────────────
  - name: "Zhejiang Huahai Pharmaceutical"
    aliases: ["Huahai", "ZHP", "Zhejiang Huahai"]
    commodity: "Cardiovascular APIs (Valsartan, Losartan, Irbesartan)"
    country: "China"
    country_code: "CN"
    tier: 1
    criticality: "critical"
    dependency_weight: 0.35
    notes: "Primary source for ARB cardiovascular APIs. History of USFDA warning letters."

  - name: "Aurobindo Pharma API Division"
    aliases: ["Aurobindo API", "Aurobindo"]
    commodity: "Antiretroviral APIs (Efavirenz, Lamivudine, Tenofovir)"
    country: "India"
    country_code: "IN"
    tier: 1
    criticality: "high"
    dependency_weight: 0.45
    notes: "Key ARV API supplier. Shares some Indian sourcing risk with Cipla's own facilities."

  - name: "Laurus Labs"
    aliases: ["Laurus"]
    commodity: "Oncology APIs (Sorafenib, Imatinib intermediates)"
    country: "India"
    country_code: "IN"
    tier: 1
    criticality: "high"
    dependency_weight: 0.40
    notes: "Critical for oncology portfolio expansion in Africa and India."

  - name: "Divi's Laboratories"
    aliases: ["Divis", "Divi's"]
    commodity: "Custom APIs and intermediates (multi-therapeutic)"
    country: "India"
    country_code: "IN"
    tier: 1
    criticality: "high"
    dependency_weight: 0.30
    notes: "Supplies custom synthesis APIs for multiple therapeutic segments."

  - name: "Lonza Group"
    aliases: ["Lonza"]
    commodity: "Respiratory APIs (Salbutamol Sulphate, Formoterol)"
    country: "Switzerland"
    country_code: "CH"
    tier: 1
    criticality: "critical"
    dependency_weight: 0.60
    notes: "Primary Salbutamol API source. Critical for Cipla's flagship Asthalin brand."

  - name: "Gujarat Alkalies and Chemicals"
    aliases: ["GACL", "Gujarat Alkalies"]
    commodity: "Solvents (Caustic Soda, Chlorine, industrial solvents)"
    country: "India"
    country_code: "IN"
    tier: 1
    criticality: "medium"
    dependency_weight: 0.25
    notes: "Industrial solvent supply for API synthesis processes."

  - name: "Schott AG"
    aliases: ["Schott"]
    commodity: "Pharmaceutical Glass Vials and Ampoules"
    country: "Germany"
    country_code: "DE"
    tier: 1
    criticality: "high"
    dependency_weight: 0.40
    notes: "Primary glass primary packaging supplier. Energy-intensive glass furnace operations."

  - name: "Uflex Ltd"
    aliases: ["Uflex"]
    commodity: "Flexible Packaging (blister films, foils, laminates)"
    country: "India"
    country_code: "IN"
    tier: 1
    criticality: "medium"
    dependency_weight: 0.35
    notes: "Key packaging material supplier for oral solid dosage forms."

  - name: "Colorcon"
    aliases: []
    commodity: "Film Coating Systems and Excipients"
    country: "USA"
    country_code: "US"
    tier: 1
    criticality: "medium"
    dependency_weight: 0.50
    notes: "Opadry and Surelease coating systems for tablet formulations."

  - name: "Balaji Amines"
    aliases: []
    commodity: "Aliphatic Amines and Specialty Chemicals"
    country: "India"
    country_code: "IN"
    tier: 1
    criticality: "medium"
    dependency_weight: 0.20
    notes: "Key chemical intermediate supplier for multiple API synthesis routes."

  # ── TIER 2: Indirect / Sub-Tier Suppliers ─────────────────────────────────
  - name: "BASF Pharma"
    aliases: ["BASF"]
    commodity: "Excipients (Kollidon, Lutrol, Kolliphor)"
    country: "Germany"
    country_code: "DE"
    tier: 2
    criticality: "medium"
    dependency_weight: 0.30
    notes: "Pharmaceutical excipients used in formulations. European sourcing dependency."

  - name: "Evonik Industries"
    aliases: ["Evonik"]
    commodity: "Drug Delivery Excipients (Eudragit polymer coatings)"
    country: "Germany"
    country_code: "DE"
    tier: 2
    criticality: "medium"
    dependency_weight: 0.25
    notes: "Modified-release polymer systems. Germany energy risk exposure."

  - name: "Changshu Pharmaceutical"
    aliases: ["Changshu"]
    commodity: "Metformin API and Intermediates"
    country: "China"
    country_code: "CN"
    tier: 2
    criticality: "medium"
    dependency_weight: 0.30
    notes: "Metformin bulk API. China regulatory and geopolitical risk."

  - name: "MTAR Technologies"
    aliases: []
    commodity: "Precision Engineering Components (manufacturing equipment parts)"
    country: "India"
    country_code: "IN"
    tier: 2
    criticality: "low"
    dependency_weight: 0.10
    notes: "Machinery parts for Cipla's manufacturing lines."

  # ── TIER 3: Raw Material / Commodity Sources ──────────────────────────────
  - name: "ONGC Petrochemicals"
    aliases: ["ONGC"]
    commodity: "Petrochemical Feedstocks (benzene, toluene, xylene)"
    country: "India"
    country_code: "IN"
    tier: 3
    criticality: "low"
    dependency_weight: 0.15
    notes: "Upstream petrochemical feedstock for solvent synthesis."

  - name: "Middle Eastern Crude Oil Exporters"
    aliases: ["Saudi Aramco", "ADNOC", "Gulf crude"]
    commodity: "Crude Oil (feedstock for petrochemical solvents)"
    country: "Saudi Arabia"
    country_code: "SA"
    tier: 3
    criticality: "medium"
    dependency_weight: 0.20
    notes: "Indirect crude oil dependency for solvent and petrochemical inputs."

